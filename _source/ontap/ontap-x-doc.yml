  permalink: manage_application_snapshot_copies.html
  ai-gen:
    keywords: snapshot copies,application consistent,crash consistent,record keeping,rpo
      setting,snapcenter backup
    lead: Manage application Snapshot copies to create and restore consistent backups
      across storage elements. Use these endpoints to schedule and flag Snapshot copies
      for record keeping, distinguishing between application consistent and crash
      consistent types. For optimal coordination with host applications, consider
      integrating with SnapCenter Backup Management.
