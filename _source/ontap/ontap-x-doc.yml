root_overview:
  ai-gen:
    keywords: ontap rest, storage management, cluster operations, svm tunneling, hal
      linking
    lead: The ONTAP REST API documentation introduces an extensive set of RESTful
      endpoints designed for managing and automating storage tasks within ONTAP environments.
      These endpoints enable you to perform operations such as provisioning storage,
      monitoring system health, and configuring network settings. Whether you're developing
      integrations or automating workflows, understanding these API calls is crucial
      for optimizing and maintaining your storage infrastructure efficiently.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud storage,object targets,manage cloud,cloud integration,storage
      management
    lead: Use cloud endpoints to manage object storage targets efficiently in your
      ONTAP environment.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,cluster management,cluster configuration,node discovery,node
      management,software update
    lead: Manage your ONTAP cluster with APIs for creating the cluster, adding nodes,
      and configuring cluster and node settings. Use these endpoints to monitor jobs
      and update software, with certain APIs available even before the cluster is
      fully created.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: networking information,ipspaces,interfaces,service policies,broadcast
      domains,ethernet ports
    lead: Explore networking endpoints to report and manage networking configurations,
      including IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains. Use these APIs to configure network access and optimize connectivity
      within your ONTAP environment.
- id: svm
  title: ONTAP REST API svm endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine, data access, protocol configuration, network
      services, name mappings
    lead: Manage Storage Virtual Machines (SVMs) and their attributes using SVM APIs,
      including protocol configurations, export policies, and network services. Use
      these endpoints to administer and secure virtualized data storage across your
      environment.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,ldap,nis,dns,svm configuration,network information
    lead: Manage name-services to authenticate users and clients accessing the storage
      system and to map user credentials in mixed environments. Configure NIS and
      LDAP services if the user database resides on those servers. DNS resolves hostnames,
      while ns-switch sets the search order for network information sources.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: fibre channel,iscsi sessions,wwpn aliases,initiator groups,lun maps,vvol
      bindings
    lead: Configure, provision, and manage SAN-related objects using the storage area
      network (SAN) endpoints. These endpoints assist with tasks such as managing
      Fibre Channel and iSCSI connections, initiator groups, LUNs, and VMware Virtual
      Volume bindings.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme fabrics,nvme services,nvme interfaces,nvme controllers,fibre channel
      logins
    lead: Configure, provision, and manage NVMe-related objects using the NVMe REST
      API endpoints. These endpoints support NVMe and NVMe over Fabrics (NVMe-oF)
      protocols, providing necessary operations for NVMe services, interfaces, subsystems,
      and namespaces.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: storage management, application templates, protocol access, database
      applications, virtualization applications, snapshot copies
    lead: Application endpoints streamline storage management by using application-specific
      terminology. By leveraging these endpoints, you can provision and manage storage
      objects tailored for specific applications, ensuring protocol access and adherence
      to best practices. Use the application APIs to view and manage ONTAP objects
      as grouped entities, with templates available for various database and virtualization
      applications.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,autosupport settings,event handling,node settings,cluster
      settings
    lead: Use ONTAP support APIs to manage configuration backups, autosupport settings,
      and event handling. Configuration backups protect node and cluster settings
      by saving copies to an external server, ensuring data integrity in single-node
      clusters.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: security settings,saml configuration,identity provider,multi-factor
      authentication,service provider protocol,web access authentication
    lead: Utilize the security endpoints to manage security settings for clusters
      and SVMs, enhancing your system's protection. Configure SAML 2.0 SP to integrate
      third-party Identity Providers for secure multi-factor authentication.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: storage management,logical storage,physical storage,volume management,aggregate
      management,snapshot management
    lead: Use ONTAP storage endpoints to manage both physical and logical storage
      components. Control aggregates, volumes, LUNs, qtrees, snapshots, quotas, and
      storage efficiency to optimize and organize your storage environment.
- id: snapmirror
  title: ONTAP REST API snapmirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror,backup data,disaster recovery,snapmirror policies,snapmirror
      relationships,snapmirror transfers
    lead: Manage SnapMirror relationships, policies, and transfers to efficiently
      copy and backup production data across local or remote volumes. Use these endpoints
      to ensure data protection and enable seamless recovery in case of primary volume
      failure.
- id: ndmp
  title: ONTAP REST API ndmp endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: network data,backups,nas data protection,ndmp sessions,volume mobility
    lead: Leverage NDMP endpoints to streamline network-based backup and restoration
      of NAS data. Utilize these endpoints to manage configurations for nodes, storage
      virtual machines, and sessions, enhancing the efficiency and speed of your data
      protection processes.
- id: snaplock
  title: ONTAP REST API snaplock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: snaplock storage,worm data,snaplock retention,regulatory compliance,non-rewritable
      storage
    lead: SnapLock endpoints manage the storage and retention of WORM data, ensuring
      non-rewritable and non-erasable storage in compliance with regulatory requirements.
      Use these endpoints to configure SnapLock features like logs, compliance clocks,
      event retention policies, file retention, privileged delete operations, file
      fingerprinting, and legal holds, providing stringent data protection for sensitive
      environments.
- id: nas
  title: ONTAP REST API NAS endpoints
  permalink: nas_endpoints.html
  ai-gen:
    keywords: nfs server,smb configuration,export policies,kerberos authentication,export
      rules
    lead: Manage NAS protocols within your ONTAP environment using endpoints for NFS
      and Kerberos configuration. These APIs help you set up and maintain NFS servers,
      export policies, and authentication protocols to ensure secure and efficient
      data access.
subcategories:
